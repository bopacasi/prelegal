# Prelegal V1 stack. Use scripts/start.sh, scripts/stop.sh and scripts/test.sh.
name: prelegal

services:
  backend:
    build:
      context: ./backend
      target: runtime
    env_file:
      - path: .env # OPENROUTER_API_KEY; see .env.example
        required: false
    environment:
      FAKE_LLM: ${FAKE_LLM:-false} # scripts/test.sh sets it, so tests never call the real LLM
    ports:
      - "8000:8000" # API docs at http://localhost:8000/docs

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runner
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # End-to-end tests against the running stack: scripts/test.sh
  integration:
    profiles: [test]
    build:
      context: ./tests/integration
    environment:
      FRONTEND_URL: http://frontend:3000
      BACKEND_URL: http://backend:8000
    depends_on:
      frontend:
        condition: service_healthy
